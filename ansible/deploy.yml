---
- name: Déploiement de app-contacts
  hosts: target
  become: false

  vars:
    project_dir: /home/fehizoro/app-contacts

  tasks:
    - name: Vérifier que le commit demandé est un SHA complet
      ansible.builtin.assert:
        that:
          - git_commit is defined
          - git_commit is match('^[0-9a-f]{40}$')
        fail_msg: "git_commit absent ou invalide : fournir un SHA de 40 caractères (-e git_commit=<sha>)."

    - name: Récupérer le projet depuis GitHub au commit voulu
      ansible.builtin.git:
        repo: "https://github.com/FehiZor0/app-contacts.git"
        dest: "{{ project_dir }}"
        version: "{{ git_commit }}"
        force: true

    - name: Générer le fichier .env sur la cible
      ansible.builtin.copy:
        dest: "{{ project_dir }}/.env"
        mode: "0600"
        content: |
          POSTGRES_DB={{ lookup('env', 'POSTGRES_DB') }}
          POSTGRES_USER={{ lookup('env', 'POSTGRES_USER') }}
          POSTGRES_PASSWORD={{ lookup('env', 'POSTGRES_PASSWORD') }}
      no_log: true

    - name: Vérifier le commit réellement récupéré
      ansible.builtin.command:
        cmd: git rev-parse HEAD
        chdir: "{{ project_dir }}"
      register: deployed_commit
      changed_when: false

    - name: Afficher le commit déployé
      ansible.builtin.debug:
        msg: "Commit déployé : {{ deployed_commit.stdout }}"

    - name: Vérifier la correspondance avec le commit Jenkins
      ansible.builtin.assert:
        that:
          - deployed_commit.stdout == git_commit
        fail_msg: >-
          Le commit déployé {{ deployed_commit.stdout }}
          ne correspond pas au commit demandé {{ git_commit }}.
        success_msg: >-
          Le commit déployé correspond au commit Jenkins :
          {{ git_commit }}

    - name: Télécharger les images Docker depuis Docker Hub
      ansible.builtin.command:
        cmd: docker compose pull backend frontend
        chdir: "{{ project_dir }}"
      environment:
        IMAGE_TAG: "{{ git_commit }}"

    - name: Démarrer l'application sans reconstruire les images
      ansible.builtin.command:
        cmd: docker compose up -d --no-build database backend frontend
        chdir: "{{ project_dir }}"
      environment:
        IMAGE_TAG: "{{ git_commit }}"

    - name: Lire l'image des conteneurs applicatifs en cours d'exécution
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format
          - "{{ '{{.Config.Image}}' }}"
          - "{{ item }}"
      loop:
        - app-contacts-backend
        - app-contacts-frontend
      register: running_images
      changed_when: false

    - name: Vérifier que les conteneurs tournent sur le tag attendu
      ansible.builtin.assert:
        that:
          - item.stdout.endswith(':' ~ git_commit)
        fail_msg: "Le conteneur {{ item.item }} utilise l'image {{ item.stdout }} au lieu du tag {{ git_commit }}."
        success_msg: "{{ item.item }} tourne sur {{ item.stdout }}"
      loop: "{{ running_images.results }}"

    - name: Vérifier que le backend est disponible
      ansible.builtin.uri:
        url: http://localhost:8000/health
        status_code: 200
        return_content: true
      register: backend_health
      retries: 10
      delay: 3
      until: backend_health.status | default(0) == 200

    - name: Vérifier que le frontend est disponible
      ansible.builtin.uri:
        url: http://localhost:8081
        status_code: 200
      register: frontend_health
      retries: 10
      delay: 3
      until: frontend_health.status | default(0) == 200

    - name: Afficher le résultat du healthcheck backend
      ansible.builtin.debug:
        msg: "Backend opérationnel : {{ backend_health.json }}"

    - name: Afficher le résultat du healthcheck frontend
      ansible.builtin.debug:
        msg: "Frontend opérationnel avec le code HTTP {{ frontend_health.status }}"
